name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy API
        run: |
          curl -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "Content-Type: application/json" \
            --data-raw '{"authtoken":"${{ secrets.DEPLOY_TOKEN }}"}'
